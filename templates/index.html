<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Treasure AI — StarMaker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #06080f;
  --bg2:     #0b0f1c;
  --bg3:     #0f1525;
  --bg4:     #141b2e;
  --gold:    #f5c518;
  --gold2:   #ffab00;
  --gold3:   #c8920a;
  --cyan:    #00e5ff;
  --cyan2:   #0097a7;
  --green:   #00e676;
  --red:     #ff1744;
  --purple:  #d500f9;
  --text:    #e8eaf6;
  --muted:   #546e7a;
  --border:  rgba(245,197,24,0.12);
  --r:       14px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BACKGROUND FX ── */
body::before {
  content:'';
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(245,197,24,0.06) 0%, transparent 60%),
    radial-gradient(ellipse 80% 80% at 100% 100%, rgba(0,229,255,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 60% 60% at 0% 80%, rgba(213,0,249,0.04) 0%, transparent 50%);
  pointer-events:none;z-index:0;
}

/* coin shimmer grid */
body::after {
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(245,197,24,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(245,197,24,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none;z-index:0;
}

main {
  position:relative;z-index:1;
  max-width:430px;margin:0 auto;
  padding:0 10px 40px;
}

/* ── HEADER ── */
header {
  text-align:center;
  padding:20px 0 16px;
  position:relative;
}
.logo-wrap {
  display:inline-flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(245,197,24,0.1),rgba(0,229,255,0.06));
  border:1px solid rgba(245,197,24,0.2);
  border-radius:50px;
  padding:8px 20px;
  margin-bottom:8px;
}
.logo-icon { font-size:20px; filter:drop-shadow(0 0 8px var(--gold)); }
.logo-text {
  font-family:'Teko',sans-serif;
  font-size:22px;font-weight:600;
  letter-spacing:3px;
  background:linear-gradient(90deg, var(--gold), var(--gold2), var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub {
  font-size:10px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;
  margin-bottom:10px;
}
.status-bar {
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;color:var(--muted);
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  border-radius:20px;padding:4px 12px;
}
.dot {
  width:6px;height:6px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── CARD ── */
.card {
  background:var(--bg2);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:16px;
  margin-bottom:10px;
}
.card-title {
  font-family:'Teko',sans-serif;
  font-size:13px;letter-spacing:2px;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.card-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ── MAIN PRED CARD ── */
.pred-card {
  background:linear-gradient(145deg, #0b1020, #0f1830);
  border:1px solid rgba(245,197,24,0.25);
  border-radius:20px;
  padding:18px 16px;
  margin-bottom:10px;
  position:relative;overflow:hidden;
  box-shadow: 0 0 40px rgba(245,197,24,0.06), inset 0 1px 0 rgba(245,197,24,0.1);
}
.pred-card::before {
  content:'';position:absolute;
  top:-60px;right:-60px;
  width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle, rgba(245,197,24,0.07) 0%, transparent 70%);
  pointer-events:none;
}
.pred-card::after {
  content:'';position:absolute;
  bottom:-40px;left:-40px;
  width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,229,255,0.05) 0%, transparent 70%);
  pointer-events:none;
}

/* Round badge */
.round-badge {
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(245,197,24,0.1);
  border:1px solid rgba(245,197,24,0.25);
  border-radius:20px;padding:4px 12px;
  font-family:'Share Tech Mono',monospace;
  font-size:12px;color:var(--gold);
  letter-spacing:1px;margin-bottom:14px;
}
.round-dot {
  width:6px;height:6px;border-radius:50%;
  background:var(--gold);
  box-shadow:0 0 8px var(--gold);
  animation:pulse 1.5s infinite;
}

/* Action banner */
.action-banner {
  border-radius:12px;padding:12px 16px;
  margin-bottom:16px;
  display:flex;align-items:center;gap:12px;
  font-family:'Teko',sans-serif;
  font-size:20px;letter-spacing:1px;font-weight:600;
}
.action-banner.play {
  background:linear-gradient(135deg,rgba(0,230,118,0.12),rgba(0,230,118,0.04));
  border:1px solid rgba(0,230,118,0.35);
  color:var(--green);
  box-shadow:0 0 20px rgba(0,230,118,0.08);
}
.action-banner.skip {
  background:linear-gradient(135deg,rgba(255,23,68,0.12),rgba(255,23,68,0.04));
  border:1px solid rgba(255,23,68,0.3);
  color:var(--red);
}
.action-icon{font-size:22px;flex-shrink:0;}
.action-text-wrap{flex:1;}
.action-detail{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:400;color:var(--muted);margin-top:1px;letter-spacing:0;}

/* Picks — horizontal side by side */
.picks-row {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:8px;align-items:center;
  margin-bottom:16px;
}
.pick-box {
  border-radius:14px;padding:14px 10px 12px;
  text-align:center;border:2px solid;
  position:relative;overflow:hidden;
  background:rgba(0,0,0,0.3);
}
.pick-box::before {
  content:'';position:absolute;
  top:0;left:0;right:0;height:2px;
  background:inherit;filter:brightness(2);
  border-radius:14px 14px 0 0;
}
.pick-rank {
  position:absolute;top:7px;left:9px;
  font-size:9px;letter-spacing:1px;
  opacity:0.5;font-family:'Share Tech Mono',monospace;
}
.pick-num {
  font-family:'Teko',sans-serif;
  font-size:42px;font-weight:700;line-height:1;margin-bottom:2px;
}
.pick-name{font-size:12px;font-weight:600;opacity:0.85;}
.pick-conf{font-size:11px;opacity:0.5;margin-top:3px;font-family:'Share Tech Mono',monospace;}
.pick-divider {
  font-family:'Teko',sans-serif;font-size:16px;
  color:var(--muted);letter-spacing:1px;text-align:center;
}

/* Entropy bar */
.ent-section{margin-top:4px;}
.ent-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px;}
.ent-track {
  position:relative;height:5px;
  background:rgba(255,255,255,0.05);
  border-radius:3px;overflow:hidden;
}
.ent-fill{height:100%;border-radius:3px;transition:width 0.6s;}
.ent-mark{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,0.25);}

/* ── SCORE BREAKDOWN ── */
.score-row {
  display:grid;
  grid-template-columns:28px 1fr 80px 42px;
  align-items:center;gap:8px;
  padding:7px 10px;
  border-radius:8px;
  margin-bottom:4px;
  background:var(--bg3);
  border:1px solid transparent;
  transition:border-color 0.2s;
}
.score-row.pick {
  border-color:rgba(245,197,24,0.25);
  background:rgba(245,197,24,0.04);
}
.score-idx {
  font-family:'Teko',sans-serif;font-size:18px;
  font-weight:600;text-align:center;line-height:1;
}
.score-nm{font-size:13px;font-weight:500;}
.score-bar-wrap{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.score-bar{height:100%;border-radius:2px;transition:width 0.6s;}
.score-pct{font-family:'Share Tech Mono',monospace;font-size:11px;text-align:right;color:var(--muted);}
.score-row.pick .score-pct{color:var(--gold);}

/* ── HISTORY STRIP ── */
.hist-strip {
  display:flex;gap:7px;
  overflow-x:auto;padding-bottom:4px;
  scrollbar-width:none;
}
.hist-strip::-webkit-scrollbar{display:none;}
.hist-item {
  flex-shrink:0;
  width:46px;height:50px;
  border-radius:10px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border:1px solid rgba(255,255,255,0.07);
  gap:2px;
  background:var(--bg3);
}
.hist-num{font-family:'Teko',sans-serif;font-size:18px;font-weight:600;line-height:1;}
.hist-rnd{font-size:9px;color:rgba(255,255,255,0.3);font-family:'Share Tech Mono',monospace;}

/* ── STATS GRID ── */
.stats-grid {
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:7px;
}
.stat-box {
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 8px;text-align:center;
}
.stat-val {
  font-family:'Teko',sans-serif;
  font-size:24px;font-weight:600;
  color:var(--cyan);line-height:1;
}
.stat-val.good{color:var(--green);}
.stat-val.warn{color:var(--gold);}
.stat-val.bad{color:var(--red);}
.stat-label{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:0.5px;}

/* ── LIVE RESULTS ── */
.results-list{display:flex;flex-direction:column;gap:5px;}
.result-row {
  display:flex;align-items:center;gap:8px;
  border-radius:9px;padding:9px 11px;
  font-size:13px;
  border:1px solid transparent;
}
.result-round {
  color:var(--muted);font-size:10px;
  width:46px;flex-shrink:0;
  font-family:'Share Tech Mono',monospace;
}
.result-pred{display:flex;gap:4px;flex:1;}
.mini-tag {
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:6px;
  font-family:'Teko',sans-serif;font-size:14px;font-weight:600;
}
.result-actual{display:flex;align-items:center;gap:5px;}
.result-badge {
  padding:2px 7px;border-radius:20px;
  font-size:11px;font-weight:600;letter-spacing:0.3px;
  font-family:'Rajdhani',sans-serif;
}
.hit-badge{background:rgba(0,230,118,0.12);color:var(--green);border:1px solid rgba(0,230,118,0.3);}
.miss-badge{background:rgba(255,23,68,0.1);color:var(--red);border:1px solid rgba(255,23,68,0.25);}

/* Live summary chips */
.live-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.chip {
  border-radius:20px;padding:4px 10px;
  font-size:12px;font-weight:600;letter-spacing:0.3px;
  border:1px solid;
}
.chip-green{background:rgba(0,230,118,0.1);color:var(--green);border-color:rgba(0,230,118,0.3);}
.chip-red{background:rgba(255,23,68,0.1);color:var(--red);border-color:rgba(255,23,68,0.25);}
.chip-blue{background:rgba(0,229,255,0.1);color:var(--cyan);border-color:rgba(0,229,255,0.25);}
.chip-gold{background:rgba(245,197,24,0.1);color:var(--gold);border-color:rgba(245,197,24,0.25);}

/* ── LOADER ── */
.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.spinner{
  width:36px;height:36px;
  border:3px solid rgba(245,197,24,0.12);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flash{0%{opacity:0.5}100%{opacity:1}}
.updated{animation:flash 0.4s ease;}

/* ── REFRESH BTN ── */
.refresh-btn {
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  background:rgba(245,197,24,0.06);
  border:1px solid rgba(245,197,24,0.2);
  border-radius:12px;padding:13px;
  color:var(--gold);font-size:14px;font-weight:600;
  cursor:pointer;margin-bottom:10px;
  transition:background 0.2s;
  font-family:'Rajdhani',sans-serif;letter-spacing:1px;
}
.refresh-btn:active{background:rgba(245,197,24,0.12);}
.countdown{font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px;font-family:'Share Tech Mono',monospace;}

/* error banner */
.err-banner{
  background:rgba(255,23,68,0.08);
  border:1px solid rgba(255,23,68,0.3);
  border-radius:10px;padding:10px 14px;
  margin-bottom:10px;font-size:12px;
}
.err-title{color:var(--red);font-weight:700;margin-bottom:3px;}
.err-msg{color:rgba(255,100,100,0.8);}

@media(max-width:360px){
  .pick-num{font-size:36px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo-wrap">
      <span class="logo-icon">🪙</span>
      <span class="logo-text">TREASURE AI</span>
    </div>
    <div class="logo-sub">StarMaker Prediction Engine</div>
    <div class="status-bar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Connecting...</span>
    </div>
  </header>

  <button class="refresh-btn" onclick="refreshAll()">
    <span class="refresh-icon">⟳</span> REFRESH &nbsp;·&nbsp; <span id="cdNum">5</span>s
  </button>

  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading prediction...</div>
    </div>
  </div>
</main>

<script>
const CLASS_COLORS = {
  1:"#c084fc",2:"#f87171",3:"#fb923c",
  4:"#facc15",5:"#fde047",6:"#4ade80",
  7:"#22d3ee",8:"#16a34a"
};
const CLASS_NAMES = {
  1:"Purple",2:"10×",3:"25×",
  4:"15×",5:"Yellow",6:"Lt. Green",
  7:"50×",8:"Dk. Green"
};

let countdown=5, countdownEl, lastRound=null;
const fmt = n => (n!=null ? n.toLocaleString() : '—');

function buildUI(pred, stats, history, status) {
  const isPlay = pred.action === 'PLAY';
  const p1c    = CLASS_COLORS[pred.pred1] || '#888';
  const p2c    = CLASS_COLORS[pred.pred2] || '#888';

  // History
  const histItems = (history||[]).map(h => {
    const c = CLASS_COLORS[h.reward_index]||'#888';
    return `<div class="hist-item" style="background:${c}14;border-color:${c}35">
      <div class="hist-num" style="color:${c}">${h.reward_index}</div>
      <div class="hist-rnd">#${h.round}</div>
    </div>`;
  }).join('');

  // Live log — ALL played rounds, newest first, no limit
  const liveEntries = (stats.live_log||[]).slice().reverse();
  const liveHits    = liveEntries.filter(r=>r.hit).length;
  const liveMisses  = liveEntries.length - liveHits;
  const liveAcc     = liveEntries.length ? (liveHits/liveEntries.length*100).toFixed(1) : null;

  let curLen=0, curType='';
  for(const r of liveEntries){
    if(curLen===0){curType=r.hit?'W':'L';curLen=1;}
    else if((r.hit&&curType==='W')||(!r.hit&&curType==='L'))curLen++;
    else break;
  }

  const resultRows = liveEntries.map(r => {
    const ac   = CLASS_COLORS[r.actual]  ||'#888';
    const p1c2 = CLASS_COLORS[r.top2[0]]||'#888';
    const p2c2 = CLASS_COLORS[r.top2[1]]||'#888';
    const bg   = r.hit ? 'rgba(0,230,118,0.06)' : 'rgba(255,23,68,0.05)';
    const bc   = r.hit ? 'rgba(0,230,118,0.15)' : 'rgba(255,23,68,0.12)';
    return `<div class="result-row" style="background:${bg};border-color:${bc}">
      <div class="result-round">#${r.round}</div>
      <div class="result-pred">
        <div class="mini-tag" style="background:${p1c2}20;color:${p1c2};border:1px solid ${p1c2}40">${r.top2[0]}</div>
        <div class="mini-tag" style="background:${p2c2}20;color:${p2c2};border:1px solid ${p2c2}40">${r.top2[1]}</div>
      </div>
      <div class="result-actual">
        <div class="mini-tag" style="background:${ac}20;color:${ac};border:1px solid ${ac}40">${r.actual}</div>
        <span class="result-badge ${r.hit?'hit-badge':'miss-badge'}">${r.hit?'✓ HIT':'✗ MISS'}</span>
      </div>
    </div>`;
  }).join('');

  // Score breakdown
  const scoreRows = Object.entries(pred.all_scores||{})
    .sort((a,b)=>b[1]-a[1])
    .map(([idx,sc]) => {
      const c  = CLASS_COLORS[idx]||'#888';
      const nm = CLASS_NAMES[idx]||idx;
      const pk = [pred.pred1,pred.pred2].includes(+idx);
      return `<div class="score-row ${pk?'pick':''}">
        <div class="score-idx" style="color:${c}">${idx}</div>
        <div class="score-nm">${nm}</div>
        <div class="score-bar-wrap">
          <div class="score-bar" style="width:${sc}%;background:${pk?c:c+'60'}"></div>
        </div>
        <div class="score-pct">${sc}%</div>
      </div>`;
    }).join('');

  // Entropy
  const entPct   = Math.min(100,(pred.entropy/3)*100);
  const entColor = pred.entropy<2?'#00e676':pred.entropy<2.7?'#facc15':'#ff1744';
  const thPct    = (2.7/3)*100;

  // Status
  const fetchErr = status && status.status==='error';
  const nextReset = status && status.next_reset_in;
  const accColor  = (stats.accuracy||0)>=60?'good':'warn';

  const html = `
    ${fetchErr ? `<div class="err-banner">
      <div class="err-title">⚠ API Error — data may be stale</div>
      <div class="err-msg">${status.last_error||''}</div>
    </div>` : ''}

    <!-- MAIN PREDICTION -->
    <div class="pred-card updated">
      <div class="round-badge">
        <span class="round-dot"></span>
        ROUND ${fmt(pred.next_round)}
        ${nextReset?`<span style="margin-left:8px;opacity:0.5;font-size:10px">Reset ${nextReset}</span>`:''}
      </div>

      <div class="action-banner ${isPlay?'play':'skip'}">
        <div class="action-icon">${isPlay?'✅':'⏭'}</div>
        <div class="action-text-wrap">
          <div>${isPlay?'PLAY THIS ROUND':'SKIP THIS ROUND'}</div>
          <div class="action-detail">${isPlay?'Bet on either pick below':(pred.skip_reason||'')}</div>
        </div>
      </div>

      <div class="picks-row">
        <div class="pick-box" style="border-color:${p1c};background:${p1c}10">
          <div class="pick-rank">PICK 1</div>
          <div class="pick-num" style="color:${p1c}">${pred.pred1}</div>
          <div class="pick-name" style="color:${p1c}">${pred.pred1_name||''}</div>
          <div class="pick-conf">${pred.pred1_conf||0}%</div>
        </div>
        <div class="pick-divider">OR</div>
        <div class="pick-box" style="border-color:${p2c};background:${p2c}10">
          <div class="pick-rank">PICK 2</div>
          <div class="pick-num" style="color:${p2c}">${pred.pred2}</div>
          <div class="pick-name" style="color:${p2c}">${pred.pred2_name||''}</div>
          <div class="pick-conf">${pred.pred2_conf||0}%</div>
        </div>
      </div>

      <div class="ent-section">
        <div class="ent-label">
          <span>Entropy</span>
          <span style="color:${entColor};font-family:'Share Tech Mono',monospace">${pred.entropy}</span>
        </div>
        <div class="ent-track">
          <div class="ent-fill" style="width:${entPct}%;background:${entColor}"></div>
          <div class="ent-mark" style="left:${thPct}%"></div>
        </div>
      </div>

      <div style="margin-top:10px;font-size:11px;color:var(--muted);font-family:'Share Tech Mono',monospace">
        LAST 10 › ${(pred.last_10||[]).join(' ')}
      </div>
    </div>

    <!-- SCORE BREAKDOWN -->
    <div class="card">
      <div class="card-title">Score Breakdown</div>
      ${scoreRows}
    </div>

    <!-- SIM STATS — 3 columns -->
    <div class="card">
      <div class="card-title">Simulation Stats</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val ${accColor}">${stats.accuracy||0}%</div>
          <div class="stat-label">Accuracy</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${stats.play_pct||0}%</div>
          <div class="stat-label">Play Rate</div>
        </div>
        <div class="stat-box">
          <div class="stat-val warn">${fmt(stats.max_loss)}</div>
          <div class="stat-label">Max Loss</div>
        </div>
        <div class="stat-box">
          <div class="stat-val good">${fmt(stats.hits)}</div>
          <div class="stat-label">Hits</div>
        </div>
        <div class="stat-box">
          <div class="stat-val bad">${fmt(stats.misses)}</div>
          <div class="stat-label">Misses</div>
        </div>
        <div class="stat-box">
          <div class="stat-val">${fmt(stats.played)}</div>
          <div class="stat-label">Played</div>
        </div>
      </div>
    </div>

    <!-- RECENT HISTORY -->
    ${histItems ? `<div class="card">
      <div class="card-title">Recent History</div>
      <div class="hist-strip">${histItems}</div>
    </div>` : ''}

    <!-- LIVE RESULTS — all played rounds, scrollable -->
    ${liveEntries.length > 0 ? `<div class="card" style="padding-bottom:0">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="card-title" style="margin:0">Live Results</div>
        <div style="font-size:11px;color:var(--muted);font-family:'Share Tech Mono',monospace">${liveEntries.length} rounds</div>
      </div>
      <div class="live-chips">
        <span class="chip chip-green">✓ ${liveHits} Hits</span>
        <span class="chip chip-red">✗ ${liveMisses} Misses</span>
        ${liveAcc!==null?`<span class="chip chip-blue">${liveAcc}% Acc</span>`:''}
        ${curLen>1?`<span class="chip chip-gold">${curType==='W'?'🔥':'❄'} ${curLen} ${curType==='W'?'Win':'Loss'}</span>`:''}
      </div>
      <div style="max-height:460px;overflow-y:auto;margin:0 -16px;padding:0 16px 16px">
        <div class="results-list">${resultRows}</div>
      </div>
    </div>` : ''}

    <div style="text-align:center;font-size:10px;color:var(--muted);padding:16px 0;letter-spacing:1px">
      PREDICTIONS ARE PROBABILISTIC · NOT FINANCIAL ADVICE
    </div>`;

  document.getElementById('app').innerHTML = html;
  countdownEl = document.getElementById('cdNum');

  if(lastRound && pred.latest_round > lastRound){
    const el = document.querySelector('.pred-card');
    if(el){ el.style.boxShadow='0 0 40px rgba(245,197,24,0.2)'; setTimeout(()=>el.style.boxShadow='',2000); }
  }
  lastRound = pred.latest_round;
}

async function refreshAll(){
  try {
    document.getElementById('statusDot').style.background='#facc15';
    const [predRes,statsRes,histRes,statusRes] = await Promise.all([
      fetch('/api/predict'),
      fetch('/api/stats'),
      fetch('/api/history'),
      fetch('/api/status')
    ]);
    if(!predRes.ok) throw new Error('Not ready');
    const pred    = await predRes.json();
    const stats   = await statsRes.json();
    const history = await histRes.json();
    const status  = statusRes.ok ? await statusRes.json() : {};
    buildUI(pred,stats,history,status);
    document.getElementById('statusDot').style.background='#00e676';
    document.getElementById('statusText').textContent=`Round #${pred.latest_round} · Live`;
    countdown=5;
  } catch(e){
    document.getElementById('statusDot').style.background='#ff1744';
    document.getElementById('statusText').textContent='Connection error';
    console.error(e);
  }
}

setInterval(()=>{
  countdown--;
  if(countdownEl) countdownEl.textContent=Math.max(0,countdown);
  if(countdown<=0){ countdown=5; refreshAll(); }
},1000);

refreshAll();
</script>
</body>
</html>
